<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de factory</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.04);
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --track: #cde2fb;
  --fill: #2a78d6;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --good-ink: #006300;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.05);
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --track: #0d366b;
    --fill: #3987e5;
    --good-ink: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --wash: rgba(255, 255, 255, 0.05);
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --track: #0d366b;
  --fill: #3987e5;
  --good-ink: #0ca30c;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-padding-top: 100px; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  position: sticky; top: 0; z-index: 5;
  background: var(--page);
  border-bottom: 1px solid var(--border);
}
.bar {
  max-width: 1200px; margin: 0 auto; padding: 12px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
}
h1 { font-size: 16px; margin: 0; font-weight: 600; }
.repo { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.spacer { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.live[data-state="on"] .dot { background: var(--good); }
.live[data-state="off"] .dot { background: var(--critical); }
nav { display: flex; gap: 4px; }
nav button, .ghost {
  font: inherit; color: var(--ink-2); background: none; border: 1px solid transparent;
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
nav button[aria-selected="true"] { color: var(--ink); border-color: var(--border); background: var(--surface); font-weight: 600; }
nav button:hover, .ghost:hover { background: var(--wash); }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
main[data-loading="true"] { opacity: 0.6; transition: opacity 0.2s; }
.warnings {
  border: 1px solid var(--border); border-left: 3px solid var(--warning);
  background: var(--surface); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px;
}
.warnings:empty { display: none; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.tile { padding: 12px 14px; min-width: 0; }
.tile .label { color: var(--ink-2); font-size: 12px; }
a.tile { display: block; color: inherit; text-decoration: none; }
a.tile:hover { background: var(--wash); }
a.tile .label::after { content: " ›"; }
.tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
.tile .value.text { font-size: 17px; padding-top: 5px; }
.tile .note { color: var(--muted); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.card { padding: 14px 16px; min-width: 0; margin-bottom: 16px; }
.grid .card { margin-bottom: 0; }
.card h2 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
.card .sub { color: var(--ink-2); font-size: 12px; margin: 0 0 10px; }
.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 8px; color: var(--ink-2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.empty { color: var(--muted); padding: 16px 0; }
details { margin-top: 8px; }
summary { color: var(--ink-2); cursor: pointer; font-size: 12px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 6px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.tooltip {
  position: fixed; z-index: 20; pointer-events: none; display: none;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  max-width: 280px;
}
.tooltip .t-title { color: var(--ink-2); margin-bottom: 4px; }
.tooltip .t-row { display: flex; align-items: center; gap: 8px; }
.tooltip .t-key { width: 12px; height: 2px; flex: none; }
.tooltip strong { font-variant-numeric: tabular-nums; }
.tooltip .t-name { color: var(--ink-2); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  color: var(--ink);
}
.chip .dot { width: 8px; height: 8px; }
button.chip { font: inherit; font-size: 12px; font-weight: 600; background: none; padding: 2px 10px; cursor: pointer; }
button.chip:hover { background: var(--wash); }
button.chip[aria-pressed="true"] { background: var(--wash); border-color: var(--fill); box-shadow: 0 0 0 1px var(--fill); }
button.chip:focus-visible, a.tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
input[type="search"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; width: min(100%, 320px); margin-bottom: 10px; }
.chart-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 0 0 8px; color: var(--muted); font-size: 12px; }
.column details { margin-top: 0; }
.column summary { font-weight: 600; margin-bottom: 6px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; cursor: pointer; }
.copy-wrap { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.copy { border-color: var(--border); padding: 2px 8px; font-size: 12px; white-space: nowrap; }
.copy-manual { white-space: pre-wrap; }
.chip[data-tone="good"] .dot { background: var(--good); }
.chip[data-tone="warning"] .dot { background: var(--warning); }
.chip[data-tone="critical"] .dot { background: var(--critical); }
.chip[data-tone="active"] .dot { background: var(--fill); animation: pulse 1.4s ease-in-out infinite; }
.chip[data-tone="muted"] .dot { background: var(--muted); }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .chip[data-tone="active"] .dot { animation: none; } }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { border-bottom: 1px solid var(--grid); padding: 10px 0; }
.feed li:last-child { border-bottom: 0; }
.feed .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.feed .who { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.feed .meta { color: var(--muted); font-size: 12px; }
.feed .desc { color: var(--ink-2); overflow-wrap: anywhere; }
.sev { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
pre.excerpt {
  white-space: pre-wrap; overflow-wrap: anywhere; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin: 6px 0 0;
  max-height: 320px; overflow-y: auto;
}
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.column h3 { font-size: 12px; color: var(--ink-2); margin: 0 0 6px; font-weight: 600; }
.feature {
  display: block; width: 100%; text-align: left; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
}
.feature:hover, .feature:focus-visible { background: var(--wash); }
.feature[aria-pressed="true"] { border-color: var(--fill); }
.feature .fid { font-weight: 600; overflow-wrap: anywhere; }
.feature .ftitle { color: var(--ink-2); font-size: 12px; }
.meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin-top: 6px; }
.meter > div { height: 100%; background: var(--fill); border-radius: 4px 0 0 4px; }
.progress-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; margin: 10px 0; }
.progress-row .meter { grid-column: 1 / -1; margin-top: 2px; }
.progress-row .count { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.tasklist { list-style: none; margin: 4px 0 0; padding: 0; }
.tasklist li { display: flex; gap: 8px; padding: 2px 0; color: var(--ink-2); }
.tasklist li[data-done="true"] { color: var(--ink); }
.check { flex: none; width: 16px; text-align: center; font-weight: 700; }
.detail-head { display: flex; align-items: flex-start; gap: 12px; }
.detail-head h2 { flex: 1; overflow-wrap: anywhere; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 8px 0; }
dt { color: var(--ink-2); }
dd { margin: 0; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Panel de factory</h1>
    <span class="repo" id="repo"></span>
    <span class="spacer"></span>
    <span class="live" id="live" data-state="wait"><span class="dot"></span><span id="live-text">Conectando…</span></span>
    <span class="live" id="fresh"></span>
    <button class="ghost" id="refresh" type="button" title="Pedir los datos ahora" aria-label="Refrescar los datos">↻</button>
    <button class="ghost" id="theme" type="button" title="Cambiar tema: Sistema, Claro u Oscuro">Tema: Sistema</button>
    <nav role="tablist" aria-label="Vistas">
      <button role="tab" type="button" id="tab-tokens" aria-controls="view-tokens" data-tab="tokens" aria-selected="true">Tokens</button>
      <button role="tab" type="button" id="tab-revisiones" aria-controls="view-revisiones" data-tab="revisiones" aria-selected="false" tabindex="-1">Revisiones</button>
      <button role="tab" type="button" id="tab-tareas" aria-controls="view-tareas" data-tab="tareas" aria-selected="false" tabindex="-1">Tareas</button>
    </nav>
  </div>
</header>
<main id="main">
  <div class="warnings" id="warnings" role="status"></div>
  <section class="kpis" id="kpis" aria-label="Indicadores"></section>
  <section id="view-tokens" role="tabpanel" aria-labelledby="tab-tokens"></section>
  <section id="view-revisiones" role="tabpanel" aria-labelledby="tab-revisiones" hidden></section>
  <section id="view-tareas" role="tabpanel" aria-labelledby="tab-tareas" hidden></section>
</main>
<div class="tooltip" id="tooltip" role="tooltip"></div>
<script>
"use strict";
const SVG_NS = "http://www.w3.org/2000/svg";
const STACK = [
  { key: "input", label: "Entrada", color: "var(--s1)" },
  { key: "cache_write", label: "Escritura de caché", color: "var(--s2)" },
  { key: "cache_read", label: "Lectura de caché", color: "var(--s3)" },
  { key: "output", label: "Salida", color: "var(--s4)" },
];
const STATUS = {
  pass: { tone: "good", icon: "✓", label: "aprobado" },
  pass_with_minor: { tone: "warning", icon: "!", label: "aprobado con menores" },
  fail: { tone: "critical", icon: "✗", label: "fallido" },
  en_curso: { tone: "active", icon: "●", label: "en curso" },
  sin_veredicto: { tone: "muted", icon: "?", label: "sin veredicto" },
  sin_cierre: { tone: "muted", icon: "○", label: "sin cierre" },
};
const FEATURE_STATUS = [
  ["in_progress", "En curso"],
  ["blocked", "Bloqueadas"],
  ["not_started", "Sin empezar"],
  ["passing", "Terminadas (passing)"],
];
const TABS = ["tokens", "revisiones", "tareas"];
const state = { snap: null, tab: "tokens", feature: null, origin: "todas", fetchedAt: 0, open: new Set(), focusDetail: false, focusCard: null, focusRuns: false, statuses: new Set(), hideUnfinished: safeStorage("get", "panel-hide-unfinished") === "1", cacheRead: safeStorage("get", "panel-cache-read") === "1", search: "" };
const numberFmt = new Intl.NumberFormat("es");
const compactFmt = new Intl.NumberFormat("es", { notation: "compact", maximumFractionDigits: 1 });
const usdFmt = new Intl.NumberFormat("es", { style: "currency", currency: "USD", maximumFractionDigits: 2 });
const pctFmt = new Intl.NumberFormat("es", { style: "percent", maximumFractionDigits: 1 });
const dateFmt = new Intl.DateTimeFormat("es", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

// --- utilidades DOM: todo el texto entra con textContent ---------------------------------
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (name === "class") el.className = value;
    else if (name === "text") el.textContent = value;
    else if (name.startsWith("on")) el.addEventListener(name.slice(2), value);
    else el.setAttribute(name, value === true ? "" : String(value));
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}
function s(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [name, value] of Object.entries(attrs || {})) el.setAttribute(name, String(value));
  return el;
}
function clear(el) { el.replaceChildren(); return el; }
// El texto entre comillas invertidas se muestra como código; una comilla sin pareja queda literal.
function richText(text) {
  const value = String(text ?? "");
  const parts = [];
  let last = 0;
  for (const match of value.matchAll(/`([^`]+)`/g)) {
    parts.push(value.slice(last, match.index), h("code", { text: match[1] }));
    last = match.index + match[0].length;
  }
  parts.push(value.slice(last));
  return parts.filter((part) => part !== "");
}
function tokensOf(row) { return STACK.reduce((sum, k) => sum + (row[k.key] || 0), 0); }
function fmtDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return Number.isNaN(d.getTime()) ? ts : dateFmt.format(d);
}
function fmtDuration(seconds) {
  if (seconds === null || seconds === undefined) return "";
  const total = Math.max(0, Math.round(seconds));
  const m = Math.floor(total / 60), sec = total % 60;
  if (m >= 60) return `${Math.floor(m / 60)} h ${m % 60} min`;
  return m ? `${m} min ${sec} s` : `${sec} s`;
}
function safeStorage(action, key, value) {
  try {
    if (action === "get") return window.localStorage.getItem(key);
    window.localStorage.setItem(key, value);
  } catch (_) { /* sin almacenamiento: el panel funciona igual */ }
  return null;
}

// --- tooltip -----------------------------------------------------------------------------
const tooltip = document.getElementById("tooltip");
function showTip(event, title, rows) {
  clear(tooltip);
  tooltip.append(h("div", { class: "t-title", text: title }));
  for (const row of rows) {
    tooltip.append(h("div", { class: "t-row" },
      row.color ? h("span", { class: "t-key", style: `background:${row.color}` }) : null,
      h("strong", { text: row.value }), h("span", { class: "t-name", text: row.name })));
  }
  tooltip.style.display = "block";
  let x, y;
  if (event.clientX !== undefined && event.type !== "focus") { x = event.clientX; y = event.clientY; }
  else { const r = event.target.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top; }
  const box = tooltip.getBoundingClientRect();
  tooltip.style.left = Math.min(window.innerWidth - box.width - 8, Math.max(8, x + 12)) + "px";
  tooltip.style.top = Math.max(8, y - box.height - 12) + "px";
}
function hideTip() { tooltip.style.display = "none"; }
function hover(el, title, rows) {
  el.setAttribute("tabindex", "0");
  const show = (e) => showTip(e, title, rows());
  el.addEventListener("pointermove", show);
  el.addEventListener("focus", show);
  el.addEventListener("pointerleave", hideTip);
  el.addEventListener("blur", hideTip);
}

// --- gráficos ----------------------------------------------------------------------------
function niceMax(value) {
  if (value <= 0) return 1;
  const exp = Math.pow(10, Math.floor(Math.log10(value)));
  for (const step of [1, 2, 2.5, 5, 10]) if (step * exp >= value) return step * exp;
  return 10 * exp;
}
function roundedTop(x, y, w, hgt, r) {
  r = Math.min(r, w / 2, hgt);
  return `M${x},${y + hgt}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt}Z`;
}
function roundedRight(x, y, w, hgt, r) {
  r = Math.min(r, hgt / 2, w);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt - r}Q${x + w},${y + hgt} ${x + w - r},${y + hgt}H${x}Z`;
}
function legend(series) {
  return h("div", { class: "legend" }, series.map((k) =>
    h("span", {}, h("span", { class: "swatch", style: `background:${k.color}` }), k.label)));
}
function table(columns, rows) {
  return h("details", {}, h("summary", { text: "Ver tabla" }),
    h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, columns.map((c) => h("th", { class: c.num ? "num" : null, text: c.label })))),
      h("tbody", {}, rows.map((row) => h("tr", {}, columns.map((c) =>
        h("td", { class: c.num ? "num" : null, text: c.value(row) }))))))));
}

// El eje es una escala de tiempo: un día sin datos es un hueco a cero, no se omite.
function continuousDays(rows) {
  const stamp = (r) => Date.parse(`${r.day}T00:00:00Z`);
  const dated = rows.filter((r) => /^\d{4}-\d{2}-\d{2}$/.test(r.day) && !Number.isNaN(stamp(r)));
  if (!dated.length) return rows;
  const known = new Map(dated.map((r) => [r.day, r]));
  const stamps = dated.map(stamp);
  const days = [];
  for (let t = Math.min(...stamps); t <= Math.max(...stamps); t += 86400000) {
    const day = new Date(t).toISOString().slice(0, 10);
    days.push(known.get(day) || { day });
  }
  return [...days, ...rows.filter((r) => !known.has(r.day))];
}

function stackedColumns(container, rows, series) {
  const width = Math.max(280, container.clientWidth || 600);
  const height = 220, left = 48, right = 8, top = 10, bottom = 26;
  const plotW = width - left - right, plotH = height - top - bottom;
  const stacked = (row) => series.reduce((sum, k) => sum + (row[k.key] || 0), 0);
  const max = niceMax(Math.max(...rows.map(stacked), 0));
  const svg = s("svg", { viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": "Tokens por día UTC" });
  const unit = s("text", { x: 0, y: height - 8, "font-size": 11, fill: "var(--muted)" });
  unit.textContent = "UTC";
  svg.append(unit);
  for (let i = 0; i <= 4; i++) {
    const value = (max / 4) * i, y = top + plotH - (plotH * value) / max;
    svg.append(s("line", { x1: left, x2: width - right, y1: y, y2: y, stroke: i ? "var(--grid)" : "var(--axis)", "stroke-width": 1 }));
    const label = s("text", { x: left - 6, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" });
    label.textContent = compactFmt.format(value);
    svg.append(label);
  }
  const band = plotW / Math.max(rows.length, 1);
  const barW = Math.max(2, Math.min(24, band * 0.6));
  const every = Math.ceil(rows.length / Math.max(1, Math.floor(plotW / 56)));
  rows.forEach((row, i) => {
    const x = left + band * i + (band - barW) / 2;
    let y = top + plotH;
    const visible = series.filter((k) => (row[k.key] || 0) > 0);
    visible.forEach((k, j) => {
      const hgt = (plotH * row[k.key]) / max;
      const gap = j > 0 ? 2 : 0; // hueco de superficie entre segmentos

  const paintBoard = () => withOpen("view-tareas", renderTasks, state.snap);
  const search = h("input", { type: "search", "aria-label": "Buscar una feature por id o título", placeholder: "Buscar por id o título", "data-fk": "feature-search", value: state.search,
    oninput: (e) => {
      state.search = e.target.value;
      if (!e.isComposing) paintBoard(); // redibujar a medias rompería una tecla muerta (á, é…)
    },
    oncompositionend: (e) => {
      state.search = e.target.value;
      paintBoard();
    } });
  view.append(h("div", { class: "card" }, h("h2", { text: "Features" }),
    h("p", { class: "sub", text: "feature_list.json · WIP=1 · pulsa una feature para ver su detalle" }),
    features.length ? search : null,
    features.length && query && !found.length ? h("p", { class: "empty", text: `Ninguna feature coincide con «${state.search.trim()}».` }) : null,
    features.length ? h("div", { class: "board" }, FEATURE_STATUS.map(([key, label]) => {
      const items = found.filter((f) => f.status === key);
      const heading = `${label} (${items.length})`;
      if (key !== "passing") return h("div", { class: "column" }, h("h3", { text: heading }), items.map(featureButton));
      // Plegada salvo si el usuario la abrió; una búsqueda la abre sin cambiar esa preferencia.
      return h("div", { class: "column" }, h("details", { "data-key": "board:passing", "data-forced": query ? "1" : null, open: Boolean(query) },
        h("summary", { text: heading }), items.map(featureButton)));
    })) : h("p", { class: "empty", text: "No hay feature_list.json." })));
  const changes = tasks.changes || [];
  view.append(h("div", { class: "card" }, h("h2", { text: "Cambios OpenSpec activos" }),
    h("p", { class: "sub", text: "Avance de tasks.md por grupo" }),
    changes.length ? changes.map((c) => h("div", {},
      h("div", { class: "progress-row" }, h("strong", { text: c.name }), h("span", { class: "count", text: `${c.done}/${c.total}` }), meter(c.done, c.total)),
      c.groups.map((g) => h("div", { class: "progress-row", style: "margin-left:12px" },
        h("span", {}, `${g.number}. `, richText(g.title)), h("span", { class: "count", text: `${g.done}/${g.total}` }), meter(g.done, g.total)))))
      : h("p", { class: "empty", text: "No hay cambios activos." })));
  const runs = tasks.runs || [];
  view.append(h("div", { class: "card" }, h("h2", { id: "runs-title", tabindex: "-1", text: "Ejecuciones de factory" }),
    h("p", { class: "sub", text: `Bandeja: ${(tasks.inbox || {}).pending || 0} pendiente(s)` }),
    runs.length ? runTable(runs) : h("p", { class: "empty", text: "Aún no hay ejecuciones." })));
}

// Los <details> abiertos sobreviven a los refrescos: se recuerdan por una clave estable.
function detailsKey(el) {
  if (el.dataset.key) return el.dataset.key;
  const card = el.closest(".card");
  const title = card && card.querySelector("h2");
  return `${title ? title.textContent : ""}:${el.querySelector("summary")?.textContent || ""}`;
}
document.addEventListener("toggle", (event) => {
  const el = event.target;
  if (!(el instanceof HTMLDetailsElement) || el.dataset.forced) return;
  if (el.open) state.open.add(detailsKey(el)); else state.open.delete(detailsKey(el));
}, true);
function restoreOpen(root, scrolls) {
  for (const el of root.querySelectorAll("details")) {
    const key = detailsKey(el);
    if (!state.open.has(key)) continue;
    el.open = true;
    const pre = el.querySelector("pre");
    if (pre && scrolls.has(key)) pre.scrollTop = scrolls.get(key);
  }
}
// El foco (y la selección de un campo) sobrevive a los refrescos: se recuerda por `data-fk`.
function keepingFocus(root, paint) {
  const active = document.activeElement;
  const key = active && root.contains(active) ? active.dataset.fk : null;
  const range = key && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
  paint();
  if (!key) return;
  const el = [...root.querySelectorAll("[data-fk]")].find((x) => x.dataset.fk === key);
  if (!el) return;
  el.focus({ preventScroll: true });
  if (range) el.setSelectionRange(...range);
}
function withOpen(id, renderView, snap) {
  const root = document.getElementById(id);
  const scrolls = new Map(); // el desplazamiento de un extracto abierto también sobrevive
  for (const el of root.querySelectorAll("details[open]")) {
    const pre = el.querySelector("pre");
    if (pre) scrolls.set(detailsKey(el), pre.scrollTop);
  }
  keepingFocus(root, () => {
    renderView(snap);
    restoreOpen(root, scrolls);
  });
}

const ALL_SECTIONS = ["tokens", "reviews", "tasks"];
function render(sections = ALL_SECTIONS) {
  const snap = state.snap;
  if (!snap) return;
  document.getElementById("repo").textContent = snap.repo || "";
  const warnings = clear(document.getElementById("warnings"));
  for (const w of snap.warnings || []) warnings.append(h("div", { text: `⚠ ${w}` }));
  renderKpis(snap);
  // Solo se rehacen las vistas cuyas fuentes cambiaron. Los gráficos de tokens necesitan el
  // ancho visible: si la pestaña está oculta, se dibujan al abrirla (selectTab).
  if (sections.includes("tokens") && state.tab === "tokens") withOpen("view-tokens", renderTokens, snap);
  if (sections.includes("reviews")) withOpen("view-revisiones", renderReviews, snap);
  if (sections.includes("tasks") || (sections.includes("reviews") && state.feature)) withOpen("view-tareas", renderTasks, snap);
  settleFocus();
}
// Abrir un detalle lo deja a la vista y con el foco; cerrarlo devuelve el foco a su tarjeta.
function settleFocus() {
  if (!state.snap) return; // queda pendiente hasta la primera instantánea
  const { focusDetail, focusCard, focusRuns } = state;
  state.focusDetail = false;
  state.focusCard = null;
  state.focusRuns = false;
  if (state.tab !== "tareas") return;
  const reveal = (title) => {
    if (!title) return;
    title.focus({ preventScroll: true });
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    title.closest(".card").scrollIntoView({ block: "start", behavior: calm ? "auto" : "smooth" });
  };
  if (focusRuns) reveal(document.getElementById("runs-title"));
  else if (focusDetail) reveal(document.getElementById("detail-title"));
  else if (focusCard) {
    const card = [...document.querySelectorAll(".feature")].find((el) => el.dataset.id === focusCard);
    if (card && !card.closest("details:not([open])")) card.focus();
    else document.querySelector('[data-fk="feature-search"]')?.focus(); // su tarjeta está plegada
  }
}

// Antes de la primera instantánea la página no sabe si hay datos: no puede decir que no los hay.
function placeholder(text) {
  for (const name of TABS) {
    clear(document.getElementById(`view-${name}`)).append(h("div", { class: "card" }, h("p", { class: "empty", role: "status", text })));
  }
}

// --- pestañas, tema y datos --------------------------------------------------------------
function selectTab(tab) {
  state.tab = tab;
  for (const button of document.querySelectorAll("nav button")) {
    const selected = button.dataset.tab === tab;
    button.setAttribute("aria-selected", String(selected));
    button.tabIndex = selected ? 0 : -1;
  }
  for (const name of TABS) document.getElementById(`view-${name}`).hidden = name !== tab;
  safeStorage("set", "panel-tab", tab);
  if (tab === "tokens" && state.snap) withOpen("view-tokens", renderTokens, state.snap); // los gráficos necesitan el ancho visible
}
// El #hash es la fuente de verdad: los clics solo lo cambian, y Atrás y Adelante funcionan solos.
function parseHash() {
  const raw = location.hash.replace(/^#/, "");
  const slash = raw.indexOf("/");
  const tab = slash < 0 ? raw : raw.slice(0, slash);
  if (!TABS.includes(tab)) return null;
  if (tab !== "tareas" || slash < 0) return { tab, feature: null };
  try {
    return { tab, feature: decodeURIComponent(raw.slice(slash + 1)) || null };
  } catch (error) { // un hash mal formado no debe impedir que arranque la página
    return { tab, feature: null };
  }
}
function applyHash() {
  let target = parseHash();
  if (!target) {
    const saved = safeStorage("get", "panel-tab");
    target = { tab: TABS.includes(saved) ? saved : "tokens", feature: null };
    history.replaceState(null, "", `#${target.tab}`); // sin esto, Atrás no sabría volver aquí
  }
  const previous = state.feature;
  state.feature = target.feature;
  if (state.feature && state.feature !== previous) state.focusDetail = true;
  if (!state.feature && previous) state.focusCard = previous;
  selectTab(target.tab);
  if (state.snap) withOpen("view-tareas", renderTasks, state.snap);
  settleFocus();
}
window.addEventListener("hashchange", applyHash);
for (const button of document.querySelectorAll("nav button")) button.addEventListener("click", () => { location.hash = button.dataset.tab; });
document.querySelector("nav").addEventListener("keydown", (event) => {
  const tabs = [...document.querySelectorAll("nav button")];
  const current = tabs.indexOf(document.activeElement);
  const next = { ArrowRight: current + 1, ArrowLeft: current - 1, Home: 0, End: tabs.length - 1 }[event.key];
  if (current < 0 || next === undefined) return;
  event.preventDefault();
  const target = tabs[(next + tabs.length) % tabs.length];
  target.focus();
  location.hash = target.dataset.tab;
});
const THEMES = { system: "Sistema", light: "Claro", dark: "Oscuro" };
function applyTheme(name) {
  if (name === "system") delete document.documentElement.dataset.theme; // manda prefers-color-scheme
  else document.documentElement.dataset.theme = name;
  document.getElementById("theme").textContent = `Tema: ${THEMES[name]}`;
}
const savedTheme = safeStorage("get", "panel-theme");
let theme = Object.hasOwn(THEMES, savedTheme ?? "") ? savedTheme : "system";
applyTheme(theme);
document.getElementById("theme").addEventListener("click", () => {
  const names = Object.keys(THEMES);
  theme = names[(names.indexOf(theme) + 1) % names.length];
  safeStorage("set", "panel-theme", theme);
  applyTheme(theme);
});
placeholder("Cargando…");
applyHash();

let pending = null;
let pendingSections = new Set();
// Las peticiones se numeran: una respuesta más antigua que la ya pintada se descarta, y cada
// sección recuerda la última petición que la pidió para repintarse con la primera respuesta
// igual o más nueva (aunque la suya se descarte o falle).
let requested = 0;
let applied = 0;
const dirty = new Map();
async function refresh(sections = ALL_SECTIONS) {
  const main = document.getElementById("main");
  const ticket = ++requested;
  for (const name of sections) dirty.set(name, ticket);
  main.dataset.loading = "true";
  try {
    const response = await fetch("/api/snapshot", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const snap = await response.json();
    if (ticket < applied) return;
    const first = !state.snap;
    applied = ticket;
    state.snap = snap;
    state.fetchedAt = Date.now();
    showFreshness();
    const due = [];
    for (const [name, asked] of dirty) if (asked <= ticket) { due.push(name); dirty.delete(name); }
    render(first ? ALL_SECTIONS : due);
  } catch (error) {
    const warnings = document.getElementById("warnings");
    document.getElementById("warn-conn")?.remove(); // un solo aviso de conexión, no uno por intento
    warnings.append(h("div", { id: "warn-conn", text: `⚠ No se pudo cargar la instantánea: ${error.message}` }));
    if (!state.snap) placeholder("Sin datos: no se pudo cargar la instantánea.");
  } finally {
    if (ticket === requested) main.dataset.loading = "false";
  }
}
function showFreshness() {
  if (state.fetchedAt) document.getElementById("fresh").textContent = `Actualizado hace ${fmtDuration((Date.now() - state.fetchedAt) / 1000)}`;
}
document.getElementById("refresh").addEventListener("click", () => refresh());
function scheduleRefresh(sections = ALL_SECTIONS) {
  for (const name of sections) if (ALL_SECTIONS.includes(name)) pendingSections.add(name);
  clearTimeout(pending);
  pending = setTimeout(() => {
    const due = [...pendingSections];
    pendingSections = new Set();
    refresh(due);
  }, 250);
}
function changedSections(event) {
  try {
    const data = JSON.parse(event.data);
    return Array.isArray(data.sections) ? data.sections : ALL_SECTIONS;
  } catch (error) {
    return ALL_SECTIONS;
  }
}
function setLive(on, text) {
  const live = document.getElementById("live");
  live.dataset.state = on ? "on" : "off";
  document.getElementById("live-text").textContent = text;
}
function connect() {
  if (!window.EventSource) { setLive(false, "Sin tiempo real"); return; }
  const source = new EventSource("/api/stream");
  source.addEventListener("hello", () => { setLive(true, "En vivo"); scheduleRefresh(); });
  source.addEventListener("change", (event) => scheduleRefresh(changedSections(event)));
  source.addEventListener("error", () => setLive(false, "Reconectando…"));
}
let lastWidth = window.innerWidth;
window.addEventListener("resize", () => {
  if (Math.abs(window.innerWidth - lastWidth) < 40) return;
  lastWidth = window.innerWidth;
  if (state.tab === "tokens" && state.snap) withOpen("view-tokens", renderTokens, state.snap);
});
const UNCLOSED_AFTER_S = 2 * 3600; // igual que reviews.UNCLOSED_AFTER_S
setInterval(() => { // antigüedad de los datos y tiempo de las revisiones en curso, sin pedir datos
  showFreshness();
  let expired = false;
  for (const el of document.querySelectorAll(".elapsed[data-started]")) {
    const started = Date.parse(el.dataset.started);
    if (Number.isNaN(started)) continue;
    const seconds = (Date.now() - started) / 1000;
    el.textContent = fmtDuration(seconds);
    // Pasar el umbral no cambia ningún archivo: se pide la instantánea para ver `sin_cierre`.
    if (seconds > UNCLOSED_AFTER_S) { expired = true; el.removeAttribute("data-started"); }
  }
  if (expired) scheduleRefresh(["reviews"]);
}, 1000);
refresh();
connect();
</script>
</body>
</html>
